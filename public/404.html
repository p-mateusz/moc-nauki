<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moc Nauki — ładowanie…</title>
    <script>
      // Awaryjny fallback: jeśli hosting zwróci 404 na trasie SPA,
      // spróbuj raz ponownie wczytać tę samą ścieżkę, a potem wróć na stronę główną.
      (function () {
        try {
          var path = window.location.pathname + window.location.search + window.location.hash;
          if (!path || path.indexOf("/404.html") === 0) {
            window.location.replace("/");
            return;
          }
          var key = "mn_spa_404_retry";
          if (sessionStorage.getItem(key) === path) {
            sessionStorage.removeItem(key);
            window.location.replace("/");
            return;
          }
          sessionStorage.setItem(key, path);
          window.location.replace(path);
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>

    <style>
      html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; text-align: center; padding: 24px; }
      .spinner { width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15); border-top-color: #6366f1;
        animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div>Trwa ładowanie strony…</div>
      <noscript><a href="/">Przejdź do strony głównej</a></noscript>
    </div>
  </body>
</html>
